name: playpredict-dev

services:
  db:
    image: postgres:18-alpine
    container_name: playpredict_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playpredict_db}
      POSTGRES_USER: ${POSTGRES_USER:-playpredict_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playpredict_password}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      # A partir de PostgreSQL 18 la imagen oficial versiona el PGDATA
      # internamente (/var/lib/postgresql/<major>/docker) y el VOLUME
      # declarado pasó a ser /var/lib/postgresql. Por eso el volumen se
      # monta en /var/lib/postgresql y no en /var/lib/postgresql/data.
      - playpredict_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playpredict_user} -d ${POSTGRES_DB:-playpredict_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: playpredict_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-playpredict_db};Username=${POSTGRES_USER:-playpredict_user};Password=${POSTGRES_PASSWORD:-playpredict_password}
      # Contraseña de los 3 ADMIN de desarrollo (Sprint 8.5). Nunca en appsettings.*.json
      # (queda trackeado por Git): se toma de .env (gitignored). Si no está definida,
      # DataSeeder cae a un valor por defecto documentado solo para desarrollo.
      DevSeed__AdminPassword: ${DEV_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8006}:8080"
    volumes:
      - ./backend:/app
      - playpredict_backend_bin:/app/bin
      - playpredict_backend_obj:/app/obj
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: playpredict_frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5175}:5175"
    volumes:
      - ./frontend:/app
      - playpredict_frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  playpredict_db_data:
  playpredict_backend_bin:
  playpredict_backend_obj:
  playpredict_frontend_node_modules:
