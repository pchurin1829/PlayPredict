# VPS-PROD-03: HTTP-01 bootstrap only. Not a public HTTP application endpoint.
# Install as /etc/nginx/sites-available/prode.odusport.com after root preflight.
server {
    listen 80;
    server_name prode.odusport.com;

    access_log /var/log/nginx/playpredict-access.log combined;
    error_log /var/log/nginx/playpredict-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-playpredict;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
