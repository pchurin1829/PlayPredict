# VPS-PROD-03: exact subdomain only; never a default/wildcard/parent-domain site.
# Keep the HTTP-01 exception for unattended certificate renewals.
server {
    listen 80;
    server_name prode.odusport.com;

    access_log /var/log/nginx/playpredict-access.log combined;
    error_log /var/log/nginx/playpredict-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-playpredict;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        return 308 https://prode.odusport.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name prode.odusport.com;

    ssl_certificate /etc/letsencrypt-playpredict/live/prode.odusport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-playpredict/live/prode.odusport.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:PLAYPREDICT_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No HSTS/includeSubDomains/preload in the initial, reversible deployment.
    access_log /var/log/nginx/playpredict-access.log combined;
    error_log /var/log/nginx/playpredict-error.log warn;
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    location / {
        # No URI suffix: preserve /api, uploads and SPA routes exactly.
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host prode.odusport.com;
        proxy_set_header X-Forwarded-Host prode.odusport.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        # No WebSocket/SSE endpoint exists in the reviewed application.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        # The application uses Bearer tokens, not cookies. Do not pass cookies
        # inherited from Domain=.odusport.com to Caddy/application logs.
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_cache off;
        proxy_redirect off;
    }
}
