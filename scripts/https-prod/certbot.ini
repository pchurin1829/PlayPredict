# Dedicated PlayPredict configuration. No credentials; operator supplies email.
# Never use the nginx/standalone installer or global hook directories.
authenticator = webroot
webroot-path = /var/www/letsencrypt-playpredict
preferred-challenges = http-01
key-type = ecdsa
elliptic-curve = secp256r1
non-interactive = true
agree-tos = true
no-directory-hooks = true
